name: Build

on:
  push:
    branches: [master]
    tags: [v*-rc.*]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Linting
        run: pnpm lint

      - name: Spellcheck
        run: pnpm spellcheck

      - name: Typecheck
        run: pnpm run typecheck:src

      - name: Testing
        run: pnpm test
